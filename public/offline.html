<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline — Prepr</title>
  <meta name="theme-color" content="#1C1B22">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1C1B22;
      color: #EDEBE6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: #24232B;
      border: 1px solid #33323C;
      border-radius: 1rem;
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #1C1B22;
      border: 1px solid #33323C;
      color: #C97B4A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #C97B4A;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #EDEBE6;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.825rem;
      line-height: 1.6;
      color: #8B899A;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      background-color: #C97B4A;
      color: #EDEBE6;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #B86B3B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">P</div>
    <div class="tag">TELEMETRY OFFLINE</div>
    <h1>Connection Lost</h1>
    <p>Prepr requires an active internet connection to stream Groq AI inference and synchronize interview session telemetry. Check your connection to resume.</p>
    <button class="btn" onclick="window.location.reload()">
      <span>↺ Reconnect Telemetry</span>
    </button>
  </div>
</body>
</html>
